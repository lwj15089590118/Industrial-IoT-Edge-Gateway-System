# nginx 站点配置：托管 React 构建产物，支持前端路由回退
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React 单页应用：所有路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash，内容变更自动失效）
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
